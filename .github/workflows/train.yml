name: Train ML Model
on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - 'requirements-gpu.txt'
      - '.github/workflows/train.yml'
  workflow_dispatch:
jobs:
  train:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gpu.txt

      - name: Run training
        working-directory: ./ml
        run: |
          python -m train

      - name: Upload train result
        uses: actions/upload-artifact@v4
        with:
          name: trained-face-detector-model-files
          path: ml/runs/face_detector/weights/


    
