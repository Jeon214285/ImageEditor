<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" href="/static/IE_favicon.ico" type="image/x-icon">
    <title>ImageEditor</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <script type="module" src="/static/js/main.js"></script>
</head>
<body>
    <h1>ImageEditor</h1>
    <!-- 이미지 업로드 버튼 -->
    <!-- 이미지 파일만 받도록 설정, 화면에 보이지 않도록 함-->
    <input type="file" id="imageInput" accept="image/*" style="display:none;">
    <button onclick="imageUpload()">이미지 업로드</button>

    <!-- 이미지 다운로드 버튼 -->
    <button onclick="imageDownload()">이미지 다운로드</button>
    <br>
    <!-- 이미지 자르기 버튼 -->
    <button onclick="imageCut()">자르기</button>
    <button id="grabcutBtn", onclick="backgroundRemoval()">배경 제거</button>
    <button onclick="imageBlur()">흐리게</button>
    <input type="range" id="blurPx" min="0" max="100" value="50"
    onchange="controlBlur()">
    <button onclick="imageRecovery()">원래대로</button>
    <br>
    <button id="faceDetectBtn" onclick="faceDetect()">얼굴 탐지</button>
    <button id="plateDetectBtn" onclick="plateDetect()">차량 번호판 탐지</button>
    <input type="range" id="conf" min="0" max="1" step="0.05" value="0.80"
    oninput="document.getElementById('confValue').innerText = Number(this.value).toFixed(2)"
    onchange="controlConf()">
    <span id="confValue">0.80</span>
    <button onclick="allBlur()">모두 흐리게</button>
    <br>
    <br>
    <canvas id="Canvas" width="0" height="0"></canvas>
</body>
</html>
